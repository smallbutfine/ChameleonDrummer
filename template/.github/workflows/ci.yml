name: CI / Cross-Platform Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Cross-Platform Build (all targets)
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. Install bootstrap tools: Inno Setup (for the Windows
      #    installer) and a bootstrap FPC (just enough to compile
      #    fpcup.lpr). The real FPC + Lazarus + cross-compilers are
      #    installed by fpcup in step 3.
      # ---------------------------------------------------------------
      - name: Install bootstrap tools
        run: |
          choco install innosetup -y --no-progress

          # The chocolatey 'freepascal' package does not include fcl-base
          # units (FileUtil.ppu is missing), so fpcup cannot compile.
          # Download the official FPC installer directly and install with
          # ALL components, which includes fcl-base.
          echo "Downloading FPC 3.2.2 installer..."
          curl -L -o /c/fpc-installer.exe \
            "https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.i386-win32.exe/download"
          echo "Installing FPC (all components)..."
          /c/fpc-installer.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART \
            /DIR=C:/fpc-bootstrap /COMPONENTS="*"
          # Add to PATH for this and subsequent steps
          echo "C:/fpc-bootstrap/bin/i386-win32" >> "$GITHUB_PATH"
          export PATH="C:/fpc-bootstrap/bin/i386-win32:$PATH"
          fpc -iV

      # ---------------------------------------------------------------
      # 2. Build the fpcup CLI tool from the fpcupdeluxe repository.
      #    fpcup.lpr is a plain console program (no LCL, no Forms).
      #    It accepts --cputarget, --ostarget, --autotools, --noconfirm
      #    and all the other flags needed for headless installation.
      #    This is the same installer engine the fpcupdeluxe GUI uses.
      # ---------------------------------------------------------------
      - name: Build fpcup CLI installer
        run: |
          # Generate fpc.cfg so fpc can find its own units
          fpcmkcfg -d basepath=C:/fpc-bootstrap -o C:/fpc-bootstrap/bin/i386-win32/fpc.cfg

          git clone --depth 1 https://github.com/LongDirtyAnimAlf/fpcupdeluxe.git /c/fpcupdeluxe-src
          cd /c/fpcupdeluxe-src
          fpc -O2 -Fusources -o/c/fpcup.exe fpcup.lpr
          /c/fpcup.exe --version

      # ---------------------------------------------------------------
      # 3. Use fpcup to install FPC + Lazarus + cross-compilers.
      #
      #    Each invocation is idempotent: the first installs FPC and
      #    Lazarus natively; subsequent runs add one cross-compiler
      #    each. --autotools tells fpcup to download the cross-bins
      #    and cross-libs (including the macOS SDK) from the fpcupdeluxe
      #    GitHub releases when the build reports them missing — this
      #    is exactly what the fpcupdeluxe GUI does.
      #
      #    Cross-targets needed (matching build_all.bat):
      #      x86_64-darwin   → ppcrossx64  (also used for win64/linux-x64)
      #      aarch64-darwin  → ppcrossa64  (macOS Apple Silicon)
      #      arm-linux       → ppcrossarm  (Linux ARM)
      # ---------------------------------------------------------------
      - name: Install FPC + Lazarus + cross-compilers via fpcup
        run: |
          FPCUP="C:/fpcupdeluxe"

          echo "=== Installing FPC + Lazarus (native) ==="
          /c/fpcup.exe \
            --installdir="$FPCUP" \
            --fpcVersion=stable \
            --lazVersion=stable \
            --noconfirm \
            --verbose

          echo ""
          echo "=== Installing cross-compiler: x86_64-darwin ==="
          /c/fpcup.exe \
            --installdir="$FPCUP" \
            --cputarget=x86_64 \
            --ostarget=darwin \
            --noconfirm \
            --verbose \
            --autotools

          echo ""
          echo "=== Installing cross-compiler: aarch64-darwin ==="
          /c/fpcup.exe \
            --installdir="$FPCUP" \
            --cputarget=aarch64 \
            --ostarget=darwin \
            --noconfirm \
            --verbose \
            --autotools

          echo ""
          echo "=== Installing cross-compiler: arm-linux ==="
          /c/fpcup.exe \
            --installdir="$FPCUP" \
            --cputarget=arm \
            --ostarget=linux \
            --noconfirm \
            --verbose \
            --autotools

          echo ""
          echo "=== fpcup installation complete ==="

      # ---------------------------------------------------------------
      # 4. Verify the toolchain is in place before building.
      # ---------------------------------------------------------------
      - name: Verify toolchain
        run: |
          FPC_BIN="C:/fpcupdeluxe/fpc/bin/i386-win32"
          echo "Cross-compilers:"
          ls -la "$FPC_BIN"/ppcross*.exe 2>/dev/null || echo "WARNING: No cross-compilers found"
          echo ""
          echo "Cross-bins (darwin):"
          ls -la "C:/fpcupdeluxe/cross/bin/all-apple/bin/" 2>/dev/null | head -10 || echo "WARNING: No darwin cross-bins"
          echo ""
          echo "Cross-bins (linux-arm):"
          ls -la "C:/fpcupdeluxe/cross/bin/linux-arm/" 2>/dev/null | head -10 || echo "WARNING: No linux-arm cross-bins"
          echo ""
          echo "Cross-libs:"
          ls -la "C:/fpcupdeluxe/cross/lib/" 2>/dev/null | head -10 || echo "WARNING: No cross-libs"
          echo ""
          echo "lazbuild:"
          ls -la "C:/fpcupdeluxe/lazarus/lazbuild.exe" 2>/dev/null || echo "WARNING: lazbuild not found"
          echo ""
          echo "windres:"
          ls -la "C:/fpcupdeluxe/fpc/bin/i386-win32/windres.exe" 2>/dev/null || echo "WARNING: windres not found"
          echo ""
          echo "Inno Setup:"
          ls -la "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" 2>/dev/null || echo "WARNING: Inno Setup not found"
          echo ""
          echo "Python:"
          python --version 2>/dev/null || echo "WARNING: Python not found"

      # ---------------------------------------------------------------
      # 5. Build all five targets using build_all.bat.
      #
      #    build_all.bat already handles:
      #      - Cross-compilation (ppcrossx64, ppcrossa64, ppcrossarm)
      #      - Resource compilation (windres)
      #      - GUI builds (lazbuild)
      #      - macOS .app bundle creation
      #      - Linux tar.gz with exec bits (two-pass tar)
      #      - macOS .app zips with correct Unix modes (zip_app.py)
      #      - Windows Inno Setup installer
      #      - Deploy folder with all artifacts
      #
      #    CI=true and NO_PAUSE=1 prevent the script from waiting
      #    for user input. NO_VERSION_BUMP is NOT set, so the patch
      #    level is bumped (same as a local build).
      # ---------------------------------------------------------------
      - name: Build all targets
        run: |
          export CI=true
          export NO_PAUSE=1
          cd "$GITHUB_WORKSPACE"
          cmd //c build_all.bat

      # ---------------------------------------------------------------
      # 6. Upload all artifacts.
      # ---------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myproject-all-targets
          path: |
            Deploy/*
            dist/
        if: always()

      # ---------------------------------------------------------------
      # 7. Build summary
      # ---------------------------------------------------------------
      - name: Build summary
        if: always()
        run: |
          echo ""
          echo "=================================================="
          echo " BUILD SUMMARY"
          echo "=================================================="
          echo "Targets built:"
          for t in win64 macos-intel macos-aarch64 linux-x64 linux-arm; do
            if [ -d "dist/$t" ]; then
              echo "  [OK]   $t"
            else
              echo "  [FAIL] $t"
            fi
          done
          echo ""
          echo "Deploy artifacts:"
          ls -la Deploy/ 2>/dev/null || echo "  (none)"
          echo "=================================================="