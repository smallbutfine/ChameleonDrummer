; Drummer timing profiles
;
; groove_bias   - bar-level offset as a fraction of a beat
;                 (positive = behind the beat, negative = pushing).
; timing_<family> - constant per-instrument-family offset in milliseconds
;                 (positive = late, negative = early). Applied during
;                 humanization on top of the random jitter.
; Families: kick, snare, hihat, cymbal, tom
;
; Unknown drummers use the [default] section. Values are musical estimates
; and meant to be edited.

[default]
groove_bias=0.005
timing_kick=0
timing_snare=0
timing_hihat=0
timing_cymbal=0
timing_tom=0

