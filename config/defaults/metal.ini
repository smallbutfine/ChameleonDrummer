; metal defaults.
;
; [bpm]       the tempo of each style when --tempo is not given;
;             "default" is used for a style not listed (a style you add)
; [drummers]  who plays when --drummer is not given, picked at random

[bpm]
default=140
heavy=140
death=195
power=160
progressive=140
thrash=200
doom=70
breakdown=100

[drummers]
preferred=bonham, roeder, dee, hoglan, peart, carey, watts, haake, doomblues
