; rock defaults.
;
; [bpm]       the tempo of each style when --tempo is not given;
;             "default" is used for a style not listed (a style you add)
; [drummers]  who plays when --drummer is not given, picked at random

[bpm]
default=120
classic=120
blues=100
alternative=130
progressive=120
punk=180
hard=140
pop=120

[drummers]
preferred=bonham, porcaro, weckl, chambers, dee, rich, copeland, smith, moon, watts, doomblues
