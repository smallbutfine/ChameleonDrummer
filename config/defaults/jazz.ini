; jazz defaults.
;
; [bpm]       the tempo of each style when --tempo is not given;
;             "default" is used for a style not listed (a style you add)
; [drummers]  who plays when --drummer is not given, picked at random

[bpm]
default=140
swing=180
bebop=250
fusion=200
latin=160
ballad=90
hard_bop=200
contemporary=140

[drummers]
preferred=weckl, chambers, rich, halpern
