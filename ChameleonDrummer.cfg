{ ChameleonDrummer — Project Configuration
  Compile with: fpc ChameleonDrummer.lpr
  Or open in Lazarus: ChameleonDrummer_lpr.lpi

  Include paths (relative to project directory):
    - core/models         : DrumInstrument, TPattern, TBeat, TSong, TSection, TFill
    - core/value_objects  : TTimeSignature, TGenerationParameters
    - generation/engines  : TD rumGenerator
    - generation/builders : TPatternBuilder
    - patterns            : TemplateComposer, all template classes
    - plugins/interfaces  : TGenrePlugin, TDrummerPlugin interfaces
    - plugins/registry    : TPluginRegistry, TPluginDiscovery
    - plugins/genres      : TMetalGenrePlugin, TRockGenrePlugin, etc.
    - plugins/drummers    : TBonhamPlugin, TPeartPlugin, etc.
    - modifications       : All composable drummer modifications
    - humanization        : TAdvancedHumanizer, TLimbConstraintEngine
    - validation          : TPhysicalConstraintChecker
    - utils               : TPatternFixer
    - api                 : TCLIInterface, TDrumGeneratorAPI
    - ai                  : TAIAPI, TAIPatternGenerator
    - config              : TVelocity, TTiming, TDefaults, TGenreBPM constants
    - export/midi         : TMIDIEngine (raw SMF writer)
    - export/reaper       : TReaperBridge, TRPPReader/Writer
}
