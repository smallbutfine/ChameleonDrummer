name: CI / Cross-Platform Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- Linux build ----
  linux:
    name: Linux (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo "Installing FPC on Ubuntu..."
          sudo apt-get update
          sudo apt-get install -y fpc lazarus
          fpc -iV 2>&1 | head -1

      - name: Compile CLI
        run: |
          cd /home/runner/work/ChameleonDrummer/ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $?"

      - name: Build GUI (Lazarus)
        if: success()
        run: |
          echo "Building GUI..."
          lazbuild --build-all --build-mode=Default gui/chameleondrummer_gui.lpi
          echo "GUI build exit code: $?"

      - name: Verify CLI produces MIDI
        if: success()
        run: |
          echo "Testing CLI MIDI generation..."
          ./ChameleonDrummer generate --genre metal --style heavy --tempo 120 --output test_verify.mid
          if [ -f test_verify.mid ]; then
            echo "SUCCESS: MIDI file produced"
            ls -la test_verify.mid
          else
            echo "FAILURE: No MIDI file produced"
            exit 1
          fi

      - name: Upload CLI binary + support files
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-linux
          path: |
            ChameleonDrummer
            chameleondrummer_gui
            mappings/
            config/
            assets/
            src/*.pas
            test_verify.mid

      - name: Upload GUI binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-gui-linux
          path: |
            chameleondrummer_gui

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: |
            compile_out.txt

  # ---- macOS build ----
  macos:
    name: macOS (native)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo "Installing FPC on macOS..."
          brew install fpc
          fpc -iV 2>&1 | head -1

      - name: Download signed Lazarus for macOS
        run: |
          echo "Downloading signed Lazarus installer for macOS..."
          curl -L -o /tmp/lazarus-macos.zip "https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8/lazarus-darwin-aarch64-4.8.zip"
          ls -la /tmp/lazarus-macos.zip
          unzip -o /tmp/lazarus-macos.zip -d /tmp/lazarus-macos
          ls -la /tmp/lazarus-macos/

      - name: Fix Lazarus & FPC Paths (Resolve Symlinks)
        run: |
          python3 -c '
import os, re

laz_dir = os.path.realpath("/tmp/lazarus-macos/lazarus")
fpc_path = os.path.realpath(os.path.join(laz_dir, "fpc/3.2.4/bin/aarch64-darwin/fpc"))
config_dir = os.path.realpath("/private/tmp/lazarus-macos/lazarus/config")
config_file = os.path.join(config_dir, "environmentoptions.xml")

print(f"Resolved Lazarus Dir: {laz_dir}")
print(f"Resolved FPC Path:    {fpc_path}")
print(f"Target Config File:   {config_file}")

os.makedirs(config_dir, exist_ok=True)

if os.path.exists(config_file):
    with open(config_file, "r", encoding="utf-8") as f:
        content = f.read()

    if "<CompilerFilename>" in content:
        content = re.sub(r"<CompilerFilename>.*?</CompilerFilename>", f"<CompilerFilename>{fpc_path}</CompilerFilename>", content)
    else:
        content = content.replace("</EnvironmentOptions>", f"  <CompilerFilename Value=\"{fpc_path}\"/>\n</EnvironmentOptions>")

    with open(config_file, "w", encoding="utf-8") as f:
        f.write(content)
else:
    minimal_xml = f"""<?xml version="1.0" encoding="UTF-8"?>
<CONFIG>
  <EnvironmentOptions>
    <CompilerFilename Value="{fpc_path}"/>
    <LazarusDirectory Value="{laz_dir}"/>
  </EnvironmentOptions>
</CONFIG>
"""
    with open(config_file, "w", encoding="utf-8") as f:
        f.write(minimal_xml)
          '

      - name: Compile CLI
        run: |
          cd /Users/runner/work/ChameleonDrummer/ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $?"

      - name: Build GUI (Lazarus)
        run: |
          echo "Building GUI with signed Lazarus..."
          LAZBUILD=$(find /tmp/lazarus-macos -name lazbuild -type f | head -n 1)
          echo "Found lazbuild at: $LAZBUILD"
          LAZARUS_DIR=$(dirname "$LAZBUILD")
          echo "Lazarus dir: $LAZARUS_DIR"
          export LAZARUS_DIR
          "$LAZBUILD" --build-all --build-mode=Default --lazarusdir="$LAZARUS_DIR" gui/chameleondrummer_gui.lpi
          echo "GUI build exit code: $?"

      - name: Verify CLI produces MIDI
        if: success()
        run: |
          echo "Testing CLI MIDI generation..."
          ./ChameleonDrummer generate --genre metal --style heavy --tempo 120 --output test_verify.mid
          if [ -f test_verify.mid ]; then
            echo "SUCCESS: MIDI file produced"
            ls -la test_verify.mid
          else
            echo "FAILURE: No MIDI file produced"
            exit 1
          fi

      - name: Upload CLI binary + support files
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-macos
          path: |
            ChameleonDrummer
            mappings/
            config/
            assets/
            src/*.pas
            test_verify.mid

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: |
            compile_out.txt

      - name: Upload GUI binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-gui-macos
          path: |
            chameleondrummer_gui