name: CI / Cross-Platform Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- Windows build ----
  windows:
    name: Windows (native)
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo FPC is available at C:\lazarus\fpc\3.2.2\bin\x86_64-win64\fpc.exe
          C:\lazarus\fpc\3.2.2\bin\x86_64-win64\fpc.exe --version

      - name: Compile CLI
        run: |
          cd B:\dev\github\ChameleonDrummer
          C:\lazarus\fpc\3.2.2\bin\x86_64-win64\fpc.exe -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo CLI compile exit code: %errorlevel%

      - name: Build GUI (Lazarus)
        if: success()
        run: |
          cd B:\dev\github\ChameleonDrummer\gui
          C:\lazarus\lazbuild.exe --build-all --build-mode=Default chameleondrummer_gui.lpi
          echo GUI build exit code: %errorlevel%

      - name: Build Inno Setup installer
        if: success()
        run: |
          cd B:\dev\github\ChameleonDrummer
          chcp 65001
          powershell -NoProfile -ExecutionPolicy Bypass -File _run_build.ps1

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-windows
          path: |
            ChameleonDrummer.exe
            ChameleonDrummer_Setup_*.exe

      - name: Upload GUI binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-gui-windows
          path: |
            chameleondrummer_gui.exe

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            compile_out.txt
            gui_build_log.txt

  # ---- Linux build ----
  linux:
    name: Linux (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo Installing FPC on Ubuntu...
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc --version | head -1

      - name: Compile CLI
        run: |
          cd /home/runner/work/ChameleonDrummer/ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $?"

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-linux
          path: |
            ChameleonDrummer

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: |
            compile_out.txt

  # ---- macOS build ----
  macos:
    name: macOS (native)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo Installing FPC on macOS...
          brew install fpc
          fpc --version | head -1

      - name: Compile CLI
        run: |
          cd /Users/runner/work/ChameleonDrummer/ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $?"

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-macos
          path: |
            ChameleonDrummer

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: |
            compile_out.txt