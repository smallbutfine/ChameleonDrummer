name: CI / Cross-Platform Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- Linux build ----
  linux:
    name: Linux (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo "Installing FPC on Ubuntu..."
          sudo apt-get update
          sudo apt-get install -y fpc lazarus
          fpc -iV 2>&1 | head -1

      - name: Compile CLI
        run: |
          cd /home/runner/work/ChameleonDrummer/ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $?"

      - name: Build GUI (Lazarus)
        if: success()
        run: |
          echo "Building GUI..."
          lazbuild --build-all --build-mode=Default gui/chameleondrummer_gui.lpi
          echo "GUI build exit code: $?"

      - name: Verify CLI produces MIDI
        if: success()
        run: |
          echo "Testing CLI MIDI generation..."
          ./ChameleonDrummer generate --genre metal --style heavy --tempo 120 --output test_verify.mid
          if [ -f test_verify.mid ]; then
            echo "SUCCESS: MIDI file produced"
            ls -la test_verify.mid
          else
            echo "FAILURE: No MIDI file produced"
            exit 1
          fi

      - name: Upload CLI binary + support files
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-linux
          path: |
            ChameleonDrummer
            chameleondrummer_gui
            mappings/
            config/
            assets/
            src/*.pas
            test_verify.mid

      - name: Upload GUI binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-gui-linux
          path: |
            chameleondrummer_gui

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: |
            compile_out.txt

  # ---- macOS build ----
  macos:
    name: macOS (native)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo "Installing FPC on macOS..."
          brew install fpc
          fpc -iV 2>&1 | head -1

      - name: Download signed Lazarus for macOS
        run: |
          echo "Downloading signed Lazarus installer for macOS..."
          curl -L -o /tmp/lazarus-macos.zip "https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8/lazarus-darwin-aarch64-4.8.zip"
          ls -la /tmp/lazarus-macos.zip
          unzip -o /tmp/lazarus-macos.zip -d /tmp/lazarus-macos
          ls -la /tmp/lazarus-macos/

      - name: Fix Lazarus Config (Point to Downloaded FPC)
        run: |
          # Find the actual FPC binary inside downloaded Lazarus
          FPC_PATH=$(find /tmp/lazarus-macos/lazarus/fpc -name "fpc" -type f 2>/dev/null | head -n 1)
          if [ -z "$FPC_PATH" ]; then
            # Fallback to Homebrew fpc if downloaded bundle lacks it
            FPC_PATH=$(which fpc)
          fi
          echo "Using FPC at: $FPC_PATH"

          # Resolve symlink for /tmp vs /private/tmp
          REAL_FPC=$(python3 -c "import os,sys; print(os.path.realpath('$FPC_PATH'))")
          echo "Real FPC path: $REAL_FPC"

          # Lazarus config directory (use realpath to avoid /tmp vs /private/tmp mismatch)
          CONFIG_DIR=$(python3 -c "import os; print(os.path.realpath('/tmp/lazarus-macos/lazarus/config'))")
          CONFIG_FILE="$CONFIG_DIR/environmentoptions.xml"
          echo "Target Config File: $CONFIG_FILE"
          mkdir -p "$CONFIG_DIR"

          if [ -f "$CONFIG_FILE" ]; then
            sed -i '' "s|<CompilerFilename>.*</CompilerFilename>|<CompilerFilename>$REAL_FPC</CompilerFilename>|" "$CONFIG_FILE"
          else
            cat > "$CONFIG_FILE" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<CONFIG>
  <EnvironmentOptions>
    <CompilerFilename Value="$REAL_FPC"/>
  </EnvironmentOptions>
</CONFIG>
EOF
          fi

          # Also fix the lazbuild call to use the correct lazarusdir
          echo "LAZARUS_DIR=/tmp/lazarus-macos/lazarus" >> $GITHUB_ENV

      - name: Compile CLI
        run: |
          cd /Users/runner/work/ChameleonDrummer/ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $?"

      - name: Build GUI (Lazarus)
        run: |
          echo "Building GUI with signed Lazarus..."
          LAZBUILD="/tmp/lazarus-macos/lazarus/lazbuild"
          echo "Found lazbuild at: $LAZBUILD"
          export LAZARUS_DIR="/tmp/lazarus-macos/lazarus"
          "$LAZBUILD" --build-all --build-mode=Default --lazarusdir="$LAZARUS_DIR" gui/chameleondrummer_gui.lpi
          echo "GUI build exit code: $?"

      - name: Verify CLI produces MIDI
        if: success()
        run: |
          echo "Testing CLI MIDI generation..."
          ./ChameleonDrummer generate --genre metal --style heavy --tempo 120 --output test_verify.mid
          if [ -f test_verify.mid ]; then
            echo "SUCCESS: MIDI file produced"
            ls -la test_verify.mid
          else
            echo "FAILURE: No MIDI file produced"
            exit 1
          fi

      - name: Upload CLI binary + support files
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-macos
          path: |
            ChameleonDrummer
            mappings/
            config/
            assets/
            src/*.pas
            test_verify.mid

      - name: Upload GUI binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-gui-macos
          path: |
            chameleondrummer_gui

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: |
            compile_out.txt