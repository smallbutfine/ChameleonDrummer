name: CI / Cross-Platform Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- Windows build ----
  windows:
    name: Windows (native)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo "Installing FPC on Windows..."
          Invoke-WebRequest -Uri "https://www.freepascal.org/pub/fpc/dist/3.2.2/x86_64-win64/fpc-3.2.2-win64.exe" -OutFile "fpc-installer.exe"
          Start-Process -FilePath "fpc-installer.exe" -ArgumentList "/quiet" -Wait
          echo "FPC installed at C:\Program Files\FreePascal\fpc-3.2.2-win64\bin\fpc.exe"
          C:\Program Files\FreePascal\fpc-3.2.2-win64\bin\fpc.exe --version

      - name: Add FPC to PATH
        run: |
          echo "C:\Program Files\FreePascal\fpc-3.2.2-win64\bin" >> $env:GITHUB_PATH
          echo "FPC added to PATH"

      - name: Compile CLI
        run: |
          cd B:\dev\github\ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $LASTEXITCODE"

      - name: Build GUI (Lazarus)
        if: success()
        run: |
          cd B:\dev\github\ChameleonDrummer\gui
          C:\lazarus\lazbuild.exe --build-all --build-mode=Default chameleondrummer_gui.lpi
          echo "GUI build exit code: $LASTEXITCODE"

      - name: Build Inno Setup installer
        if: success()
        run: |
          cd B:\dev\github\ChameleonDrummer
          chcp 65001
          powershell -NoProfile -ExecutionPolicy Bypass -File _run_build.ps1

      - name: Verify CLI produces MIDI
        if: success()
        run: |
          echo "Testing CLI MIDI generation..."
          .\ChameleonDrummer.exe generate --genre metal --style heavy --tempo 120 --output test_verify.mid
          if (Test-Path test_verify.mid) {
            echo "SUCCESS: MIDI file produced"
            dir test_verify.mid
          } else {
            echo "FAILURE: No MIDI file produced"
            exit 1
          }

      - name: Upload CLI binary + support files
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-windows
          path: |
            ChameleonDrummer.exe
            ChameleonDrummer_Setup_*.exe
            mappings/
            config/
            assets/
            src/*.pas
            test_verify.mid

      - name: Upload GUI binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-gui-windows
          path: |
            chameleondrummer_gui.exe

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            compile_out.txt
            gui_build_log.txt

  # ---- Linux build ----
  linux:
    name: Linux (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo "Installing FPC on Ubuntu..."
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV 2>&1 | head -1

      - name: Compile CLI
        run: |
          cd /home/runner/work/ChameleonDrummer/ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $?"

      - name: Verify CLI produces MIDI
        if: success()
        run: |
          echo "Testing CLI MIDI generation..."
          ./ChameleonDrummer generate --genre metal --style heavy --tempo 120 --output test_verify.mid
          if [ -f test_verify.mid ]; then
            echo "SUCCESS: MIDI file produced"
            ls -la test_verify.mid
          else
            echo "FAILURE: No MIDI file produced"
            exit 1
          fi

      - name: Upload CLI binary + support files
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-linux
          path: |
            ChameleonDrummer
            mappings/
            config/
            assets/
            src/*.pas
            test_verify.mid

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: |
            compile_out.txt

  # ---- macOS build ----
  macos:
    name: macOS (native)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo "Installing FPC on macOS..."
          brew install fpc
          fpc -iV 2>&1 | head -1

      - name: Compile CLI
        run: |
          cd /Users/runner/work/ChameleonDrummer/ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $?"

      - name: Verify CLI produces MIDI
        if: success()
        run: |
          echo "Testing CLI MIDI generation..."
          ./ChameleonDrummer generate --genre metal --style heavy --tempo 120 --output test_verify.mid
          if [ -f test_verify.mid ]; then
            echo "SUCCESS: MIDI file produced"
            ls -la test_verify.mid
          else
            echo "FAILURE: No MIDI file produced"
            exit 1
          fi

      - name: Upload CLI binary + support files
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-macos
          path: |
            ChameleonDrummer
            mappings/
            config/
            assets/
            src/*.pas
            test_verify.mid

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: |
            compile_out.txt