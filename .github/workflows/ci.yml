name: CI / Cross-Platform Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- Linux build ----
  linux:
    name: Linux (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo "Installing FPC on Ubuntu..."
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV 2>&1 | head -1

      - name: Compile CLI
        run: |
          cd /home/runner/work/ChameleonDrummer/ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $?"

      - name: Verify CLI produces MIDI
        if: success()
        run: |
          echo "Testing CLI MIDI generation..."
          ./ChameleonDrummer generate --genre metal --style heavy --tempo 120 --output test_verify.mid
          if [ -f test_verify.mid ]; then
            echo "SUCCESS: MIDI file produced"
            ls -la test_verify.mid
          else
            echo "FAILURE: No MIDI file produced"
            exit 1
          fi

      - name: Upload CLI binary + support files
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-linux
          path: |
            ChameleonDrummer
            mappings/
            config/
            assets/
            src/*.pas
            test_verify.mid

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: |
            compile_out.txt

  # ---- macOS build ----
  macos:
    name: macOS (native)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Free Pascal
        run: |
          echo "Installing FPC on macOS..."
          brew install fpc
          fpc -iV 2>&1 | head -1

      - name: Compile CLI
        run: |
          cd /Users/runner/work/ChameleonDrummer/ChameleonDrummer
          fpc -O2 -Fusrc -Sg -Sc ChameleonDrummer.lpr
          echo "CLI compile exit code: $?"

      - name: Verify CLI produces MIDI
        if: success()
        run: |
          echo "Testing CLI MIDI generation..."
          ./ChameleonDrummer generate --genre metal --style heavy --tempo 120 --output test_verify.mid
          if [ -f test_verify.mid ]; then
            echo "SUCCESS: MIDI file produced"
            ls -la test_verify.mid
          else
            echo "FAILURE: No MIDI file produced"
            exit 1
          fi

      - name: Upload CLI binary + support files
        uses: actions/upload-artifact@v4
        with:
          name: chameleondrummer-cli-macos
          path: |
            ChameleonDrummer
            mappings/
            config/
            assets/
            src/*.pas
            test_verify.mid

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: |
            compile_out.txt
